name: release

# Publishes luxvigil to PyPI when you publish a release on GitHub.
# No tokens or passwords anywhere: PyPI trusts this exact workflow
# ("trusted publishing"), which is set up once on pypi.org.
#
# Actions are pinned to a commit, not a tag: a tag can be moved to point at
# other code, a commit can't. Dependabot opens a PR when there's a new version.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      # the release tag (v0.1.0) has to match the version in the code,
      # otherwise we'd publish something different from what the release says
      - name: check the tag matches the version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/luxvigil/__init__.py').read())[1])")
          echo "code says $version, tag says $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: pip install build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # this is what lets PyPI check it's really this workflow
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
