[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luxvigil"
version = "0.0.1"
description = "Find out who's been eating your free AI credits."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "polfananas" }]
dependencies = []

[project.scripts]
luxvigil = "luxvigil.cli:main"

[tool.hatch.build.targets.wheel]
