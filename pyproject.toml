[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luxvigil"
dynamic = ["version"]  # read from src/luxvigil/__init__.py, so it lives in one place
description = "Abuse forensics for AI APIs: find account farms, leaked keys and bots hiding in your request logs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "polfananas" }]
keywords = ["security", "fraud", "abuse", "llm", "api", "forensics", "free tier"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/polfananas/luxvigil"
Issues = "https://github.com/polfananas/luxvigil/issues"
Changelog = "https://github.com/polfananas/luxvigil/blob/main/CHANGELOG.md"
Benchmarks = "https://github.com/polfananas/luxvigil/tree/main/benchmarks"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
luxvigil = "luxvigil.cli:main"

[tool.hatch.version]
path = "src/luxvigil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/luxvigil"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]  # just the demo gif for the readme, no need to ship it
